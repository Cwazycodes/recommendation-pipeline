name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  check:
    name: CI checks
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: "2.5.1"
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: poetry
          cache-dependency-path: poetry.lock

      - name: Install dependencies
        run: make install

      - name: Run quality checks
        run: make check

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-coverage
          path: coverage.xml
          if-no-files-found: warn

      # For the README's coverage badge. The repository is public, so Codecov
      # takes the upload without a token: the job needs no secret and no OIDC
      # token, which would let code running in CI on main assume the AWS
      # deploy role. A failed upload does not fail the job.
      - name: Upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@v7
        with:
          files: coverage.xml
          disable_search: true
          fail_ci_if_error: false

  flink:
    name: Flink tests against the oracle
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: "2.5.1"
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: poetry
          cache-dependency-path: poetry.lock

      - name: Set up Java for PyFlink
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        run: make install

      - name: Run Flink tests
        run: make test-flink


  integration:
    name: Kafka integration tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: "2.5.1"
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Install integration dependencies
        run: poetry install --with flink

      - name: Run Kafka integration tests
        run: make test-int

  schema:
    name: Event schema compatibility
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          # All history, so origin/main is there to compare with.
          fetch-depth: 0

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: "2.5.1"
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: poetry
          cache-dependency-path: poetry.lock

      - name: Install dependencies
        run: poetry install

      # The same Kafka and Schema Registry as the local stack, from
      # docker-compose.yml, so CI gets the answer a producer would.
      - name: Start Kafka and the Schema Registry
        run: |
          cp .env.example .env
          docker compose up -d --wait schema-registry

      # Fails if a schema in this branch would break one released on main.
      - name: Check the event schemas against main
        run: make schema-check SCHEMA_BASE=origin/main

      - name: Run the Schema Registry tests
        run: make test-registry

  terraform:
    name: Terraform format and validate
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.17.1"

      - name: Check formatting and validate
        run: make tf-check
