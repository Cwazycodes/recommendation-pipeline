
services:
  kafka:
    image: apache/kafka:3.9.1
    container_name: recommendation-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller

      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT

      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 6

    volumes:
      - kafka_data:/var/lib/kafka/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:29092 >/dev/null 2>&1",
        ]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s

  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    container_name: recommendation-kafka-ui
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      # So the UI shows Avro events decoded.
      KAFKA_CLUSTERS_0_SCHEMAREGISTRY: http://schema-registry:8081
    depends_on:
      kafka:
        condition: service_healthy

  # The event schemas. It refuses a new version that would break an earlier
  # one (docs/adr/0006-avro-events.md), and keeps them in Kafka, in _schemas.
  schema-registry:
    image: confluentinc/cp-schema-registry:7.7.1
    container_name: recommendation-schema-registry
    ports:
      # Host 8085, because Flink's web UI has 8081.
      - "8085:8081"
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: kafka:29092
      # Each version must read, and be read by, every other (schema_registry.py).
      SCHEMA_REGISTRY_SCHEMA_COMPATIBILITY_LEVEL: full_transitive
      # It needs little, and the Docker VM has little to spare.
      SCHEMA_REGISTRY_HEAP_OPTS: -Xms64m -Xmx256m
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8081/subjects >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  flink-jobmanager:
    build:
      context: .
      dockerfile: Dockerfile.flink
    image: recommendation-pipeline/flink:1.20.1
    command: jobmanager
    # The job reads its FLINK_* and KAFKA_* settings from the environment.
    env_file: .env
    ports:
      - "8081:8081"
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        parallelism.default: 1
        state.checkpoints.dir: file:///opt/flink/checkpoints
        state.checkpoint-storage: filesystem
        metrics.reporter.prom.factory.class: org.apache.flink.metrics.prometheus.PrometheusReporterFactory
        metrics.reporter.prom.port: 9249
    volumes:
      - flink-checkpoints:/opt/flink/checkpoints
      - ./jobs:/opt/flink/jobs:ro
      - ./src:/opt/flink/src:ro
    depends_on:
      - kafka

  flink-taskmanager:
    image: recommendation-pipeline/flink:1.20.1
    command: taskmanager
    env_file: .env
    # If the TaskManager dies, bring it back so the job's restart strategy has somewhere to run (see docs/design.md, "Checkpoints, restarts...").
    restart: unless-stopped
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        taskmanager.numberOfTaskSlots: 2
        metrics.reporter.prom.factory.class: org.apache.flink.metrics.prometheus.PrometheusReporterFactory
        metrics.reporter.prom.port: 9249
    volumes:
      - flink-checkpoints:/opt/flink/checkpoints
      - ./src:/opt/flink/src:ro
      - ./jobs:/opt/flink/jobs:ro
    depends_on:
      - flink-jobmanager
      - kafka
      - schema-registry
  dynamodb-local:
    image: amazon/dynamodb-local:3.3.2
    container_name: recommendation-dynamodb
    user: root
    command: -jar DynamoDBLocal.jar -sharedDb -dbPath /home/dynamodblocal/data
    ports:
      # Host 8001, because 8000 is often taken by other local servers.
      - "8001:8000"
    volumes:
      - dynamodb_data:/home/dynamodblocal/data
  # Kafka's end offsets for Prometheus. With the offsets the job's source has
  # read to, they give consumer lag (docs/metrics.md, "Consumer lag").
  kafka-exporter:
    image: danielqsj/kafka-exporter:v1.9.0
    container_name: recommendation-kafka-exporter
    command: --kafka.server=kafka:29092
    # It exits when Kafka is not up yet, so Docker starts it again.
    restart: unless-stopped
    depends_on:
      - kafka

  # Scrapes Flink, Kafka's offsets and the results writer (infra/prometheus/prometheus.yml).
  prometheus:
    image: prom/prometheus:v3.5.0
    container_name: recommendation-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      # A day of samples is plenty for local runs.
      - --storage.tsdb.retention.time=1d
    ports:
      - "9090:9090"
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    # The writer runs on the host. Docker Desktop provides host.docker.internal;
    # this makes it work on Linux too.
    extra_hosts:
      - "host.docker.internal:host-gateway"
volumes:
  kafka_data:
  flink-checkpoints:
  dynamodb_data:
  prometheus_data:
