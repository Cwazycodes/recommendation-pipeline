[project]
name = "realtime-recommendation-pipeline"
version = "1.0.0"
description = "A real-time trending programme recommendation pipeline using Kafka, Flink and AWS"
authors = [
    { name = "cwazycodes", email = "mhussain2002@icloud.com" }
]
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "pydantic (>=2.0,<3.0)",
    "confluent-kafka (>=2.16.0,<3.0.0)",
    "boto3[crt] (>=1.43,<2.0)",
    "pydantic-settings (>=2.16,<3.0)",
    "prometheus-client (>=0.21,<1.0)",
    "fastavro (>=1.9,<2)",
]

[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)",
    "pytest-cov (>=7.1.0,<8.0.0)",
    "ruff (>=0.17.2,<0.18.0)",
    "mypy (>=2.4.0,<3.0.0)",
    "pre-commit (>=4.7.0,<5.0.0)",
    "testcontainers (>=4.10,<5)",
    "moto[dynamodb] (>=5.2,<6)",
    "matplotlib (>=3.9,<4.0)",
]
flink = [
    "apache-flink (==1.20.1)",
    "setuptools (<85)"
]
lambda = [
    "pydantic (>=2.0,<3.0)",
    "pydantic-settings (>=2.16,<3.0)"
]

[tool.poetry]
packages = [
    { include = "realtime_recommendation_pipeline", from = "src" }
]

[tool.poetry.group.flink]
optional = true

# make package-lambda uses poetry export, a plugin since Poetry 2.0; Poetry
# installs it for this project on first use.
[tool.poetry.requires-plugins]
poetry-plugin-export = ">=1.10,<2.0"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[[tool.mypy.overrides]]
module = ["pyflink", "pyflink.*", "boto3", "boto3.*", "botocore", "botocore.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
markers = [
    "integration: tests requiring a running Docker environment",
    "slow: tests that run a local Flink mini-cluster (need Java)",
    "e2e: tests that run the whole pipeline on the Compose stack (make test-e2e)",
    "registry: tests against the Schema Registry of the Compose stack (make test-registry)",
]
