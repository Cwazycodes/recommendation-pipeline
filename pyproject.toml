[project]
name = "realtime-recommendation-pipeline"
version = "0.1.0"
description = "A real-time trending programme recommendation pipeline using Kafka, Flink and AWS"
authors = [
    { name = "cwazycodes", email = "mhussain2002@icloud.com" }
]
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = ["pydantic (>=2.0,<3.0)", "confluent-kafka (>=2.16.0,<3.0.0)"]

[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)",
    "pytest-cov (>=7.1.0,<8.0.0)",
    "ruff (>=0.17.2,<0.18.0)",
    "mypy (>=2.4.0,<3.0.0)",
    "pre-commit (>=4.7.0,<5.0.0)",
    "testcontainers (>=4.10,<5)"
]
flink = [
    "apache-flink (==1.20.1)",
    "setuptools (<85)"
]

[tool.poetry]
packages = [
    { include = "realtime_recommendation_pipeline", from = "src" }
]

[tool.poetry.group.flink]
optional = true

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[[tool.mypy.overrides]]
module = ["pyflink", "pyflink.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
markers = [
    "integration: tests requiring a running Docker environment",
]
